<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>HTML preview</title>
    <link rel="stylesheet" href="viewer.css">
</head>
<body>
    <header id="toolbar">
        <div id="diff-controls" class="controls" hidden>
            <div class="group" role="group" aria-label="View mode">
                <button id="mode-inline" class="seg" type="button">Inline</button>
                <button id="mode-split" class="seg" type="button">Side by side</button>
            </div>
            <div class="legend">
                <span class="swatch added"></span>Added
                <span class="bubble">&minus;</span>Removed (click it)
                <span class="swatch modified"></span>Changed
            </div>
            <span id="stats"></span>
            <div class="group" role="group" aria-label="Navigate changes">
                <button id="prev" class="seg" type="button" title="Previous change">&uarr;</button>
                <button id="next" class="seg" type="button" title="Next change">&darr;</button>
            </div>
        </div>
        <div id="blob-controls" class="controls" hidden>
            <strong id="title"></strong>
            <a id="github-link" target="_blank" rel="noopener noreferrer">Open on GitHub</a>
            <span class="spacer"></span>
            <label id="scripts-label" title="Runs the page's own JavaScript in an isolated sandbox. Only enable for files you trust.">
                <input id="run-scripts" type="checkbox"> Run scripts (untrusted)
            </label>
        </div>
    </header>
    <div id="script-warning" hidden>Scripts are running in an isolated sandbox with no access to GitHub or this extension, but they can still make network requests and open windows. Only use this on files you trust.</div>
    <div id="notice" hidden></div>
    <main id="stage"><div id="status">Loading&hellip;</div></main>
    <script src="../viewer.js"></script>
</body>
</html>
