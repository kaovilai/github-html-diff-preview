version: 2

# One pull request per run for every ecosystem, so there is a single PR to review and merge.
# .github/workflows/dependabot-automerge.yml merges it once CI has passed on that exact commit.
multi-ecosystem-groups:
  all:
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    # typescript-eslint's peer range stops below TypeScript 6.1; lift this once it supports newer majors
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    multi-ecosystem-group: all

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    # generated by `gh aw compile` with its own pinned action SHAs; editing it by hand would make it stale
    exclude-paths:
      - ".github/workflows/*.lock.yml"
    multi-ecosystem-group: all
