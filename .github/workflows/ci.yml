name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run zip
      - name: Lint the Firefox build
        run: npx --yes web-ext@8 lint --source-dir dist/firefox --warnings-as-errors=false
      - run: npx playwright install --with-deps chromium
      - run: npm run build:chrome
      - name: End-to-end tests
        run: npx playwright test --project=e2e
      - name: Accessibility tests (WCAG 2.2 AA contrast, every button, touch targets)
        run: npx playwright test --project=a11y
      - uses: actions/upload-artifact@v7
        with:
          name: extension-zips
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
