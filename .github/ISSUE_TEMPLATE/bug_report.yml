name: Other bug
description: Something else does not work
title: "[bug] "
body:
  - type: textarea
    id: urls
    attributes:
      label: GitHub URL(s) involved (optional)
      description: One per line. Public URLs let the automated helper look at the same page.
  - type: textarea
    id: actual
    attributes:
      label: What happens
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria (expected behaviour)
      description: |
        What should be true once this is fixed? One short, checkable statement per line. An automated helper turns each line into a test, so be concrete.
      placeholder: |
        - A Preview button appears next to Raw on the file page
        - The new <h2> is outlined green in the inline diff
        - The stylesheet css/site.css is applied in the preview
      render: markdown
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 141, Firefox 140, ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown on the extensions page
      placeholder: 0.1.0
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Before you submit
      options:
        - label: I did not paste a personal access token, cookie or any other secret
          required: true
        - label: I checked the [troubleshooting guide](https://github.com/kaovilai/github-html-preview/blob/main/docs/TROUBLESHOOTING.md)
          required: true
